<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table.tab1 {
            width: 500px;
            border-collapse: collapse;
        }

        .titulo {
            text-align: center;
            vertical-align: middle;
            padding: 5px 150px 5px 225px;
            border: 1px solid black;
            border-radius: 10px 10px 00px 0px;
            font-size: 20px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
        }

        tr.linha {
            background-color: black;
            color: white;

        }

        td.dado {
            background-color: darkred;
            color: yellow;
        }

        table {
            width: 500px;
            padding: 10px;
            text-align: center;

        }
        .numero{
            text-align: right;
        }
    </style>

</head>

<body>
    <h1>Minha Primeira Tabela</h1>
    <!--
Hierarquia de Tabelas
    TABLE=TABELA
    TABLE ROW=LINHA DA TABELA
    TABLE DATA=DADOS DA TABELA
    TABLE HEADER=CABEÇALHO DA TABELA
-->
    <table class="tab1">
        <tr>
            <tb class="titulo">Tabela Criada</tb>
        </tr>
        <tr class="linha"> <!--Primeira Linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
            <td>D1</td>
            <td>E1</td>
            <td>F1</td>
        </tr>
        <tr> <!--Segunda Linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
            <td>D2</td>
            <td class="dado">E2</td>
        </tr>
        <tr> <!--Terceira Linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
            <td class="dado">D3</td>
        </tr>
        <tr> <!--Quarta Linha-->
            <td>A4</td>
            <td>B4</td>
            <td class="dado">C4</td>
        </tr>
        <tr>
            <td>A5</td>
            <td class="dado">B5</td>
        </tr>
        <tr>
            <td class="dado">A6</td>
        </tr>
        <!--Se a hierarquia nao for respeitada, o resultado pode ficar errado.-->
    </table>

    <h1>Minha Primeira Tabela</h1>

    <table>

        <tr> <!--Primeira Linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>

        </tr>
        <tr> <!--Segunda Linha-->
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>

        </tr>
        <tr> <!--Terceira Linha-->
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>

        </tr>
        <tr> <!--Quarta Linha-->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>


        <!--Se a hierarquia nao for respeitada, o resultado pode ficar errado.-->
    </table>

</body>

</html>
