<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em varios dispositivos ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
         <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Audio</h1>
    <p>Vamos aprender a reproduzir audio em HTML</p>
    <audio preload="metadata" controls>
        <source src="midia/midia3.mp3" type="audio/mpeg">
        <source src="midia/midia4.ogg" type="audio/ogg">
        <source src="midia/midia2.wav" type="audio/wav"><!--Arquivo muito pesado, nao usar. usar somente se for para donwload, caso seja para produzir no site, usar mp3-->
        <p>Infelizmente seu navegador nao consegue reproduzir audio.<a href="midia/midia3.mp3"></a> Clique aqui para baixar o arquivo MP3</p>
    </audio>
</body>
</html>
